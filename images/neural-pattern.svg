<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4C4A8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D4C4A8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Synaptic Connections -->
  <g stroke="#D4C4A8" stroke-width="0.8" stroke-opacity="0.12">
    <!-- Tile internal lines -->
    <line x1="30" y1="45" x2="110" y2="95"/>
    <line x1="30" y1="45" x2="60" y2="190"/>
    <line x1="110" y1="95" x2="210" y2="60"/>
    <line x1="110" y1="95" x2="170" y2="175"/>
    <line x1="210" y1="60" x2="265" y2="135"/>
    <line x1="60" y1="190" x2="170" y2="175"/>
    <line x1="60" y1="190" x2="130" y2="265"/>
    <line x1="170" y1="175" x2="235" y2="245"/>
    <line x1="265" y1="135" x2="235" y2="245"/>
    <line x1="130" y1="265" x2="235" y2="245"/>
    <!-- Subtle secondary connections -->
    <line x1="30" y1="45" x2="210" y2="60" stroke-opacity="0.06" stroke-dasharray="3,3"/>
    <line x1="110" y1="95" x2="130" y2="265" stroke-opacity="0.06" stroke-dasharray="3,3"/>
    
    <!-- Seamless wrap connections to neighbors -->
    <!-- to right (+300) -->
    <line x1="265" y1="135" x2="330" y2="45" stroke-opacity="0.09"/>
    <line x1="210" y1="60" x2="330" y2="45" stroke-opacity="0.09"/>
    <line x1="235" y1="245" x2="360" y2="190" stroke-opacity="0.09"/>
    <!-- to left (-300) -->
    <line x1="30" y1="45" x2="-35" y2="135" stroke-opacity="0.09"/>
    <line x1="30" y1="45" x2="-90" y2="60" stroke-opacity="0.09"/>
    <line x1="60" y1="190" x2="-65" y2="245" stroke-opacity="0.09"/>
    <!-- to bottom (+300) -->
    <line x1="130" y1="265" x2="110" y2="395" stroke-opacity="0.09"/>
    <line x1="235" y1="245" x2="210" y2="360" stroke-opacity="0.09"/>
    <line x1="60" y1="190" x2="30" y2="345" stroke-opacity="0.09"/>
    <!-- to top (-300) -->
    <line x1="110" y1="95" x2="130" y2="-35" stroke-opacity="0.09"/>
    <line x1="210" y1="60" x2="235" y2="-55" stroke-opacity="0.09"/>
    <line x1="30" y1="45" x2="60" y2="-110" stroke-opacity="0.09"/>
  </g>
  
  <!-- Neural Nodes -->
  <g fill="#D4C4A8">
    <circle cx="30" cy="45" r="3" fill-opacity="0.4"/>
    <circle cx="30" cy="45" r="7" fill="url(#glow)"/>
    
    <circle cx="110" cy="95" r="2.5" fill-opacity="0.35"/>
    <circle cx="110" cy="95" r="6" fill="url(#glow)"/>
    
    <circle cx="210" cy="60" r="3.5" fill-opacity="0.45"/>
    <circle cx="210" cy="60" r="8" fill="url(#glow)"/>
    
    <circle cx="265" cy="135" r="2.5" fill-opacity="0.35"/>
    <circle cx="265" cy="135" r="6" fill="url(#glow)"/>
    
    <circle cx="60" cy="190" r="3" fill-opacity="0.4"/>
    <circle cx="60" cy="190" r="7" fill="url(#glow)"/>
    
    <circle cx="170" cy="175" r="3.5" fill-opacity="0.45"/>
    <circle cx="170" cy="175" r="8" fill="url(#glow)"/>
    
    <circle cx="235" cy="245" r="2.5" fill-opacity="0.35"/>
    <circle cx="235" cy="245" r="6" fill="url(#glow)"/>
    
    <circle cx="130" cy="265" r="2.5" fill-opacity="0.35"/>
    <circle cx="130" cy="265" r="6" fill="url(#glow)"/>
  </g>
</svg>