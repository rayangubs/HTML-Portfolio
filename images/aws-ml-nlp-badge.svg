<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="nlpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A38"/>
      <stop offset="100%" stop-color="#0E1720"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8E8"/>
      <stop offset="100%" stop-color="#007EA7"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Hexagonal / Shield Outer -->
  <polygon points="250,20 440,130 440,370 250,480 60,370 60,130" fill="url(#nlpGrad)" stroke="url(#tealGrad)" stroke-width="12" filter="url(#shadow2)"/>
  <polygon points="250,38 422,138 422,362 250,462 78,362 78,138" fill="none" stroke="#D4C4A8" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- AWS Academy text -->
  <text x="250" y="105" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#00A8E8" text-anchor="middle" letter-spacing="3">AWS ACADEMY</text>
  <text x="250" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#D4C4A8" text-anchor="middle" letter-spacing="2">GRADUATE</text>
  
  <!-- Neural / NLP Icon -->
  <g transform="translate(195, 160) scale(0.22)">
    <circle cx="100" cy="80" r="35" fill="#00A8E8"/>
    <circle cx="380" cy="80" r="35" fill="#00A8E8"/>
    <circle cx="240" cy="220" r="45" fill="#FF9900"/>
    <circle cx="100" cy="360" r="35" fill="#00A8E8"/>
    <circle cx="380" cy="360" r="35" fill="#00A8E8"/>
    <line x1="100" y1="80" x2="240" y2="220" stroke="#EDEDED" stroke-width="16" stroke-opacity="0.6"/>
    <line x1="380" y1="80" x2="240" y2="220" stroke="#EDEDED" stroke-width="16" stroke-opacity="0.6"/>
    <line x1="100" y1="360" x2="240" y2="220" stroke="#EDEDED" stroke-width="16" stroke-opacity="0.6"/>
    <line x1="380" y1="360" x2="240" y2="220" stroke="#EDEDED" stroke-width="16" stroke-opacity="0.6"/>
  </g>
  
  <!-- Title -->
  <text x="250" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" fill="#EDEDED" text-anchor="middle" letter-spacing="1">MACHINE LEARNING</text>
  <text x="250" y="330" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" fill="#00A8E8" text-anchor="middle" letter-spacing="2">FOR NLP</text>
  
  <!-- Ribbon -->
  <rect x="130" y="365" width="240" height="36" rx="6" fill="#00A8E8"/>
  <text x="250" y="390" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#0E1720" text-anchor="middle" letter-spacing="2">SPECIALTY</text>
</svg>