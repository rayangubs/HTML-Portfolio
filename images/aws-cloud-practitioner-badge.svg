<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B263B"/>
      <stop offset="100%" stop-color="#0D1B2A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FFB84D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Hexagonal / Shield Outer -->
  <polygon points="250,20 440,130 440,370 250,480 60,370 60,130" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#shadow)"/>
  <polygon points="250,38 422,138 422,362 250,462 78,362 78,138" fill="none" stroke="#D4C4A8" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- AWS text -->
  <text x="250" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#FF9900" text-anchor="middle" letter-spacing="4">AWS CERTIFIED</text>
  
  <!-- Cloud Icon -->
  <g transform="translate(180, 145) scale(0.28)">
    <path d="M400 320 H120 C60 320 10 270 10 210 C10 155 52 110 105 102 C125 42 182 0 250 0 C330 0 395 55 410 130 C455 138 490 178 490 225 C490 278 450 320 400 320 Z" fill="#FF9900"/>
  </g>
  
  <!-- Title -->
  <text x="250" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#EDEDED" text-anchor="middle" letter-spacing="1">CLOUD</text>
  <text x="250" y="330" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#EDEDED" text-anchor="middle" letter-spacing="1">PRACTITIONER</text>
  
  <!-- Badge Ribbon / Level -->
  <rect x="130" y="365" width="240" height="36" rx="6" fill="#FF9900"/>
  <text x="250" y="390" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" fill="#0D1B2A" text-anchor="middle" letter-spacing="2">FOUNDATIONAL</text>
</svg>